name: Build and push agentbox flavors

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flavors:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [core, k8s, terraform, pulumi, full]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build flavor
        run: |
          set -euo pipefail
          chmod +x build.sh capsule image/entrypoint.sh image/modules/*.sh proxy/entrypoint.sh
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            ./build.sh --flavor "${{ matrix.flavor }}"
          else
            ./build.sh --flavor "${{ matrix.flavor }}" --push
            if [[ "${{ matrix.flavor }}" == "core" ]]; then
              docker tag wsams/agentbox:core wsams/agentbox:latest
              docker push wsams/agentbox:latest
            fi
          fi

  proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build proxy
        uses: docker/build-push-action@v6
        with:
          context: ./proxy
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            wsams/agentbox-proxy:latest
            wsams/agentbox-proxy:dev
