# agentbox build defaults. Plain KEY=VALUE — parsed, not sourced.
# IMAGE here is for local ./build.sh only (not published). capsule launches
# wsams/agentbox:core unless AGENTBOX_IMAGE is set.
IMAGE=wsams/agentbox:dev
PLATFORM=
# Lean local iteration; clear WITHOUT or use --flavor full for everything.
WITHOUT=databases,aws,gcp,azure,rust,argocd,mesh,local-k8s
WITH=
