# agentbox build defaults. Plain KEY=VALUE — parsed, not sourced.
# Flags on build.sh always win for that one build.

# Image repository and moving tag for local/dev builds.
IMAGE=wsams/agentbox:dev

# docker build --platform (empty = host default)
PLATFORM=

# Feature groups off by default for :dev local iteration.
# Clear WITHOUT (or set WITH) to enlarge; use flavors/*.conf for published tags.
WITHOUT=databases,aws,gcp,azure,rust,argocd
WITH=
